[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldir-agent-compiler"
version = "0.3.0"
description = "WorldIR LLM compiler core and local sidecar server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
worldir-agent = "worldir_agent.cli:main"
worldir-agent-server = "worldir_agent.server.__main__:main"

[tool.setuptools.packages.find]
include = ["worldir_agent*"]
